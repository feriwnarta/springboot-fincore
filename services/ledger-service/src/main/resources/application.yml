spring:
  application:
    name: ledger-service
  datasource:
    url: ${LEDGER_DB_URL:jdbc:postgresql://localhost:5432/fincore_ledger}
    username: ${LEDGER_DB_USERNAME:${USER}}
    password: ${LEDGER_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${LEDGER_DB_POOL_SIZE:10}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/fincore}
          jwk-set-uri: ${OIDC_JWK_SET_URI:${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${LEDGER_KAFKA_CONSUMER_GROUP:fincore-ledger-service}
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

fincore:
  security:
    mode: ${FINCORE_SECURITY_MODE:oauth2}
    audience: ${OIDC_AUDIENCE:fincore-api}
  kafka:
    loan-topic: ${FINCORE_LOAN_EVENTS_TOPIC:fincore.loan.events.v1}
    ledger-topic: ${FINCORE_LEDGER_EVENTS_TOPIC:fincore.ledger.events.v1}
    consumer-group: ${LEDGER_KAFKA_CONSUMER_GROUP:fincore-ledger-service}
    consumer:
      retry-interval: ${FINCORE_KAFKA_CONSUMER_RETRY_INTERVAL:1000ms}
      max-attempts: ${FINCORE_KAFKA_CONSUMER_MAX_ATTEMPTS:3}
      dlq-suffix: ${FINCORE_KAFKA_DLQ_SUFFIX:.DLQ}
    outbox-relay:
      enabled: ${FINCORE_LEDGER_OUTBOX_RELAY_ENABLED:false}
      fixed-delay: ${FINCORE_LEDGER_OUTBOX_RELAY_FIXED_DELAY:1000ms}
      batch-size: ${FINCORE_LEDGER_OUTBOX_RELAY_BATCH_SIZE:50}
      claim-lease: ${FINCORE_LEDGER_OUTBOX_RELAY_CLAIM_LEASE:30s}
      send-timeout: ${FINCORE_LEDGER_OUTBOX_RELAY_SEND_TIMEOUT:5s}

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
